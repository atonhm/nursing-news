<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>간호·의료 모닝뉴스</title>
<meta name="description" content="매일 아침 7시에 갱신되는 간호·의료 뉴스 모음">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="모닝뉴스">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap">
<style>
:root {
  --bg: #fff; --text: #111; --muted: #757575; --soft: #f5f5f5; --line: #e5e5e5;
  --inv-bg: #111; --inv-text: #fff;
  --tab-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #000; --text: #fff; --muted: #9e9e9e; --soft: #1c1c1c; --line: #262626;
          --inv-bg: #fff; --inv-text: #111; }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font-family: Pretendard, -apple-system, "Malgun Gothic", sans-serif; line-height: 1.45;
  -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }

.app { max-width: 640px; margin: 0 auto;
  padding: calc(20px + env(safe-area-inset-top)) 0 calc(var(--tab-h) + 32px + env(safe-area-inset-bottom)); }
.pad { padding: 0 20px; }

/* 헤더 */
.eyebrow { font-family: Oswald, sans-serif; font-weight: 500; font-size: 13px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--muted); margin: 8px 0 2px; }
h1 { font-size: 40px; font-weight: 900; letter-spacing: -0.045em; line-height: 1.05; margin: 0; }
.meta-line { margin-top: 8px; font-size: 14px; color: var(--muted); }
.top-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--soft);
  display: grid; place-items: center; flex: none; margin-top: 6px; }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn.spin svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 섹션 타이틀 */
.sec-title { display: flex; align-items: baseline; justify-content: space-between; margin: 36px 0 14px; }
.sec-title h2 { font-size: 24px; font-weight: 900; letter-spacing: -0.04em; margin: 0; }
.sec-title span { font-size: 14px; color: var(--muted); font-weight: 600; }

/* 탑 스토리 캐러셀 */
.carousel { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory;
  padding: 0 20px; scroll-padding: 0 20px; scrollbar-width: none; }
.carousel::-webkit-scrollbar { display: none; }
.hero { position: relative; flex: none; width: 84%; max-width: 420px; aspect-ratio: 5 / 6;
  border-radius: 14px; overflow: hidden; scroll-snap-align: start; color: #fff;
  display: flex; flex-direction: column; justify-content: flex-end; padding: 22px; }
.hero::before { content: attr(data-word); position: absolute; top: -8px; left: -6px; right: -6px;
  font-family: Oswald, sans-serif; font-weight: 700; font-size: 150px; line-height: .82; white-space: nowrap;
  text-transform: uppercase; letter-spacing: -.02em; color: rgba(255,255,255,.1); }
.hero::after { content: ""; position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,.55), transparent 60%); }
.hero.photo { background-size: cover !important; background-position: center !important; }
.hero.photo::before { display: none; }
.hero.photo::after { background: linear-gradient(to top, rgba(0,0,0,.85) 10%, rgba(0,0,0,.25) 55%, rgba(0,0,0,.1)); }

/* 기사 팝업(바텀시트) */
.backdrop { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.45); opacity: 0;
  pointer-events: none; transition: opacity .25s; }
.backdrop.open { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-width: 640px; margin: 0 auto;
  max-height: 88vh; overflow-y: auto; overscroll-behavior: contain; background: var(--bg);
  border-radius: 20px 20px 0 0; padding: 10px 20px calc(24px + env(safe-area-inset-bottom));
  transform: translateY(105%); transition: transform .3s cubic-bezier(.2,.8,.2,1); }
.sheet.open { transform: none; }
.sheet.dragging { transition: none; }
.handle { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 16px; }
.sheet-img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 12px; background: var(--soft);
  display: block; margin-bottom: 18px; }
.sheet .chip { background: var(--inv-bg); color: var(--inv-text); display: inline-block; margin-bottom: 12px; }
.sheet h3 { font-size: 22px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.35; margin: 0 0 8px; }
.sheet .m { font-size: 13px; color: var(--muted); }
.sheet .desc { font-size: 15.5px; line-height: 1.65; margin: 16px 0 0; color: var(--text); opacity: .85; }
.skel { height: 14px; border-radius: 7px; background: var(--soft); margin-top: 10px; animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .5; } }
.actions { display: flex; gap: 10px; margin-top: 24px; }
.btn-primary { flex: 1; height: 52px; border-radius: 999px; background: var(--inv-bg); color: var(--inv-text);
  font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; }
.btn-round { width: 52px; height: 52px; border-radius: 50%; background: var(--soft); flex: none;
  display: grid; place-items: center; }
.btn-round svg { width: 22px; height: 22px; }
.btn-round[aria-pressed="true"] svg { fill: currentColor; }

/* 앱 안에서 기사 읽기 */
.reader { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column;
  transform: translateY(100%); transition: transform .3s cubic-bezier(.2,.8,.2,1); }
.reader.open { transform: none; }
.reader-bar { display: flex; align-items: center; gap: 8px; padding: calc(8px + env(safe-area-inset-top)) 12px 8px;
  border-bottom: 1px solid var(--line); }
.reader-bar b { flex: 1; text-align: center; font-size: 15px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.reader-bar .icon-btn { margin: 0; }
.reader iframe { flex: 1; width: 100%; border: 0; background: #fff; }
.toast { position: fixed; left: 50%; bottom: calc(var(--tab-h) + 20px + env(safe-area-inset-bottom)); z-index: 40;
  transform: translate(-50%, 20px); opacity: 0; transition: .25s; background: var(--inv-bg); color: var(--inv-text);
  font-size: 14px; font-weight: 600; padding: 12px 20px; border-radius: 999px; pointer-events: none; white-space: nowrap; }
.toast.show { transform: translate(-50%, 0); opacity: 1; }
.hero > * { position: relative; z-index: 1; }
.chip { align-self: flex-start; font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px;
  background: #fff; color: #111; margin-bottom: 14px; }
.hero h3 { font-size: 24px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.25; margin: 0 0 12px;
  display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
.hero .src { font-size: 13px; opacity: .75; }

/* 카테고리 필 */
.pills { display: flex; gap: 8px; overflow-x: auto; padding: 0 20px; margin-top: 32px; scrollbar-width: none;
  position: sticky; top: 0; z-index: 5; background: var(--bg); padding-top: calc(10px + env(safe-area-inset-top)); padding-bottom: 10px; }
.pills::-webkit-scrollbar { display: none; }
.pill { flex: none; font-size: 15px; font-weight: 600; padding: 9px 18px; border-radius: 999px;
  background: var(--soft); transition: background .15s, color .15s; }
.pill[aria-pressed="true"] { background: var(--inv-bg); color: var(--inv-text); }

/* 기사 리스트 */
.list { list-style: none; margin: 0; padding: 0; }
.row { display: flex; gap: 14px; align-items: flex-start; padding: 16px 0; border-bottom: 1px solid var(--line); }
.row .num { font-family: Oswald, sans-serif; font-weight: 700; font-size: 20px; line-height: 1.3;
  width: 26px; flex: none; color: var(--muted); }
.row a { flex: 1; min-width: 0; }
.row .t { font-size: 16.5px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.4; }
.row a:visited .t { color: var(--muted); }
.row .m { font-size: 13px; color: var(--muted); margin-top: 5px; }
.save { width: 36px; height: 36px; flex: none; display: grid; place-items: center; margin: -4px -8px 0 0; }
.save svg { width: 20px; height: 20px; }
.save[aria-pressed="true"] svg { fill: currentColor; }

/* 지난 뉴스 */
.day-row { display: flex; align-items: center; gap: 16px; width: 100%; text-align: left;
  padding: 18px 0; border-bottom: 1px solid var(--line); }
.day-row .d { font-family: Oswald, sans-serif; font-weight: 700; font-size: 34px; line-height: 1; width: 64px; }
.day-row .w { flex: 1; }
.day-row .w b { display: block; font-size: 17px; letter-spacing: -0.02em; }
.day-row .w span { font-size: 13px; color: var(--muted); }
.day-row .go { color: var(--muted); font-size: 22px; }

.empty { text-align: center; color: var(--muted); padding: 64px 20px; font-size: 15px; }
.empty b { display: block; color: var(--text); font-size: 20px; font-weight: 800; margin-bottom: 6px; }
.back { display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 700;
  padding: 7px 14px; border-radius: 999px; background: var(--soft); margin-top: 14px; }

/* 하단 탭바 */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--bg);
  border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.tabbar .inner { max-width: 640px; margin: 0 auto; display: flex; height: var(--tab-h); }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font-size: 11px; font-weight: 600; color: var(--muted); }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="true"] { color: var(--text); }
footer { text-align: center; font-size: 12px; color: var(--muted); margin-top: 40px; }
</style>
</head>
<body>
<div class="app" id="app"></div>

<nav class="tabbar"><div class="inner">
  <button class="tab" data-view="today">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>오늘</button>
  <button class="tab" data-view="archive">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>지난 뉴스</button>
  <button class="tab" data-view="saved">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4.5L5 21V4a1 1 0 0 1 1-1z"/></svg>저장</button>
</div></nav>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="기사 미리보기"></div>
<div class="reader" id="reader" role="dialog" aria-modal="true" aria-label="기사 읽기">
  <div class="reader-bar">
    <button class="icon-btn" data-action="close" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <b id="reader-title"></b>
    <a class="icon-btn" id="reader-ext" target="_blank" rel="noopener" aria-label="새 창으로 열기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></a>
  </div>
  <iframe id="reader-frame" title="기사 원문" referrerpolicy="no-referrer"></iframe>
</div>
<div class="toast" id="toast"></div>

<script>
const WORDS = { nursing: 'Nursing', policy: 'Policy', hospital: 'Hospital', tech: 'Health Tech' };
const COLORS = { nursing: '#111111', policy: '#24364a', hospital: '#4a2a24', tech: '#2c2a4a' };
const BOOKMARK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4.5L5 21V4a1 1 0 0 1 1-1z"/></svg>';
const REFRESH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>';

const app = document.getElementById('app');
const state = { days: [], view: 'today', dayIdx: 0, cat: 'all', loading: true, error: false };

const store = {
  get() { try { return JSON.parse(localStorage.getItem('saved') || '[]'); } catch { return []; } },
  set(v) { try { localStorage.setItem('saved', JSON.stringify(v)); } catch {} },
};
let saved = store.get();
const isSaved = (link) => saved.some((s) => s.link === link);

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ago = (iso) => {
  const h = Math.floor((Date.now() - new Date(iso)) / 3600e3);
  if (h < 1) return '방금';
  if (h < 24) return `${h}시간 전`;
  return new Date(iso).toLocaleDateString('ko-KR', { month: 'long', day: 'numeric' });
};
const kdate = (d) => new Date(d + 'T00:00:00+09:00');
const eyebrow = (d) => kdate(d).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }).replace(',', ' ·');
const longDate = (d) => kdate(d).toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'long' });
const count = (day) => day.categories.reduce((n, c) => n + c.items.length, 0);

const row = (it, i) => `
  <li class="row">
    <div class="num">${String(i + 1).padStart(2, '0')}</div>
    <a href="${esc(it.link)}" target="_blank" rel="noopener" data-open="${esc(it.link)}">
      <div class="t">${esc(it.title)}</div>
      <div class="m">${esc(it.source)} · ${ago(it.published)}</div>
    </a>
    <button class="save" data-link="${esc(it.link)}" aria-pressed="${isSaved(it.link)}" aria-label="저장">${BOOKMARK}</button>
  </li>`;

function viewToday() {
  if (state.loading) return `<div class="pad"><p class="eyebrow">Loading</p><h1>오늘의 뉴스</h1><p class="meta-line">불러오는 중…</p></div>`;
  if (state.error || !state.days.length)
    return `<div class="pad"><h1>오늘의 뉴스</h1></div><div class="empty"><b>뉴스를 불러오지 못했어요</b>잠시 후 새로고침해 주세요.</div>`;

  const day = state.days[state.dayIdx];
  const latest = state.dayIdx === 0;
  const heroes = day.categories.filter((c) => c.items.length).map((c) => ({ ...c.items[0], cat: c }));
  const cats = day.categories.filter((c) => state.cat === 'all' || c.id === state.cat);
  const updated = new Date(day.updatedAt).toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' });

  return `
    <div class="pad top-row">
      <div>
        <p class="eyebrow">${eyebrow(day.date)}</p>
        <h1>${latest ? '오늘의 뉴스' : longDate(day.date).replace(/ \S+요일$/, '')}</h1>
        <p class="meta-line">기사 ${count(day)}건 · ${updated} 업데이트</p>
        ${latest ? '' : '<button class="back" data-action="latest">← 최신 뉴스로</button>'}
      </div>
      <button class="icon-btn" data-action="reload" aria-label="새로고침">${REFRESH}</button>
    </div>

    <div class="pad sec-title"><h2>주요 뉴스</h2><span>밀어서 보기 →</span></div>
    <div class="carousel">
      ${heroes.map((h) => `
        <a class="hero${h.image ? ' photo' : ''}" href="${esc(h.link)}" target="_blank" rel="noopener" data-open="${esc(h.link)}"
           data-word="${WORDS[h.cat.id] || h.cat.name}"
           style="background:${h.image ? `#111 url('${esc(h.image).replace(/'/g, '%27')}')` : COLORS[h.cat.id] || '#111'}">
          <span class="chip">${esc(h.cat.name)}</span>
          <h3>${esc(h.title)}</h3>
          <span class="src">${esc(h.source)} · ${ago(h.published)}</span>
        </a>`).join('')}
    </div>

    <div class="pills">
      ${[{ id: 'all', name: '전체' }, ...day.categories].map((c) =>
        `<button class="pill" data-cat="${c.id}" aria-pressed="${state.cat === c.id}">${c.name}</button>`).join('')}
    </div>

    <div class="pad">
      ${cats.map((c) => `
        <div class="sec-title"><h2>${c.name}</h2><span>${c.items.length}건</span></div>
        ${c.items.length ? `<ul class="list">${c.items.map(row).join('')}</ul>` : '<div class="empty">기사가 없어요</div>'}
      `).join('')}
      <footer>매일 오전 7시 업데이트 · 출처 Google 뉴스</footer>
    </div>`;
}

function viewArchive() {
  return `
    <div class="pad">
      <p class="eyebrow">Archive</p>
      <h1>지난 뉴스</h1>
      <p class="meta-line">최근 ${state.days.length}일치 뉴스를 볼 수 있어요</p>
      <div style="margin-top:20px">
        ${state.days.map((d, i) => `
          <button class="day-row" data-day="${i}">
            <span class="d">${kdate(d.date).getDate()}</span>
            <span class="w"><b>${longDate(d.date)}${i === 0 ? ' · 최신' : ''}</b><span>기사 ${count(d)}건</span></span>
            <span class="go">›</span>
          </button>`).join('') || '<div class="empty">아직 지난 뉴스가 없어요</div>'}
      </div>
    </div>`;
}

function viewSaved() {
  return `
    <div class="pad">
      <p class="eyebrow">Saved</p>
      <h1>저장한 기사</h1>
      <p class="meta-line">나중에 읽을 기사를 모아두는 곳이에요</p>
      ${saved.length
        ? `<ul class="list" style="margin-top:16px">${saved.map(row).join('')}</ul>`
        : `<div class="empty"><b>아직 저장한 기사가 없어요</b>기사 오른쪽 책갈피를 눌러 저장해 보세요.</div>`}
    </div>`;
}

function render() {
  app.innerHTML = { today: viewToday, archive: viewArchive, saved: viewSaved }[state.view]();
  document.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-current', t.dataset.view === state.view));
}

function go(view) {
  state.view = view;
  render();
  window.scrollTo(0, 0);
}

function findItem(link) {
  for (const d of state.days) for (const c of d.categories) for (const it of c.items) if (it.link === link) return it;
  return saved.find((s) => s.link === link);
}

function findCat(link) {
  for (const d of state.days) for (const c of d.categories) if (c.items.some((it) => it.link === link)) return c.name;
  return '';
}

/* ---------- 기사 팝업 ---------- */
const sheet = document.getElementById('sheet');
const backdrop = document.getElementById('backdrop');
const reader = document.getElementById('reader');
const SHARE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13M7 8l5-5 5 5M5 14v6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6"/></svg>';
const articleCache = new Map();
let current = null; // 팝업에 열린 기사
let layers = 0; // 열린 팝업 수 (뒤로가기 처리용)

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove('show'), 1800);
}

function getArticle(link) {
  if (!articleCache.has(link)) {
    const it = findItem(link);
    const p = it?.url
      ? Promise.resolve(it)
      : fetch('/api/article?link=' + encodeURIComponent(link)).then((r) => (r.ok ? r.json() : Promise.reject()));
    articleCache.set(link, p.catch(() => { articleCache.delete(link); return null; }));
  }
  return articleCache.get(link);
}

function sheetHTML(it, info) {
  const loading = info === undefined;
  const img = info?.image || it.image;
  const primary = loading
    ? `<button class="btn-primary" disabled style="opacity:.5">불러오는 중…</button>`
    : info?.embeddable
      ? `<button class="btn-primary" data-action="read">앱에서 읽기</button>`
      : `<a class="btn-primary" href="${esc(info?.url || it.link)}" target="_blank" rel="noopener">원문 보기 ↗</a>`;
  const cat = findCat(it.link);
  return `
    <div class="handle"></div>
    ${img ? `<img class="sheet-img" src="${esc(img)}" alt="" onerror="this.remove()">` : ''}
    ${cat ? `<span class="chip">${esc(cat)}</span>` : ''}
    <h3>${esc(it.title)}</h3>
    <div class="m">${esc(it.source)} · ${ago(it.published)}</div>
    ${loading
      ? '<div class="skel"></div><div class="skel"></div><div class="skel" style="width:60%"></div>'
      : info?.description ? `<p class="desc">${esc(info.description)}</p>` : ''}
    <div class="actions">
      ${primary}
      <button class="btn-round" data-link="${esc(it.link)}" aria-pressed="${isSaved(it.link)}" aria-label="저장">${BOOKMARK}</button>
      <button class="btn-round" data-action="share" aria-label="공유">${SHARE}</button>
    </div>`;
}

async function openSheet(link) {
  const it = findItem(link);
  if (!it) return;
  current = { it, info: undefined };
  sheet.innerHTML = sheetHTML(it);
  sheet.scrollTop = 0;
  sheet.style.transform = '';
  sheet.classList.add('open');
  backdrop.classList.add('open');
  if (!layers) { history.pushState({ layer: 1 }, ''); layers = 1; }
  const info = await getArticle(link);
  if (current?.it !== it) return;
  current.info = info;
  sheet.innerHTML = sheetHTML(it, info);
}

function openReader() {
  const { it, info } = current;
  document.getElementById('reader-title').textContent = it.source;
  document.getElementById('reader-ext').href = info.url;
  document.getElementById('reader-frame').src = info.url;
  reader.classList.add('open');
  history.pushState({ layer: 2 }, '');
  layers = 2;
}

function closeTop() {
  if (layers === 2) {
    reader.classList.remove('open');
    setTimeout(() => { if (!reader.classList.contains('open')) document.getElementById('reader-frame').src = 'about:blank'; }, 300);
    layers = 1;
  } else if (layers === 1) {
    sheet.classList.remove('open');
    backdrop.classList.remove('open');
    current = null;
    layers = 0;
  }
}

// 휴대폰 뒤로가기 = 팝업 닫기
window.addEventListener('popstate', closeTop);
const back = () => (layers ? history.back() : null);
backdrop.addEventListener('click', back);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') back(); });

// 아래로 끌어서 닫기
let dragY = null;
sheet.addEventListener('touchstart', (e) => { if (sheet.scrollTop <= 0) dragY = e.touches[0].clientY; }, { passive: true });
sheet.addEventListener('touchmove', (e) => {
  if (dragY === null) return;
  const dy = e.touches[0].clientY - dragY;
  if (dy > 0) { sheet.classList.add('dragging'); sheet.style.transform = `translateY(${dy}px)`; }
}, { passive: true });
sheet.addEventListener('touchend', (e) => {
  if (dragY === null) return;
  const dy = e.changedTouches[0].clientY - dragY;
  dragY = null;
  sheet.classList.remove('dragging');
  sheet.style.transform = '';
  if (dy > 100) back();
});

async function share() {
  const { it, info } = current;
  const url = info?.url || it.link;
  try {
    if (navigator.share) await navigator.share({ title: it.title, url });
    else { await navigator.clipboard.writeText(url); toast('링크를 복사했어요'); }
  } catch {}
}

document.addEventListener('click', (e) => {
  const a = e.target.closest('a[data-open]');
  if (a && !e.metaKey && !e.ctrlKey && !e.shiftKey) {
    e.preventDefault();
    openSheet(a.dataset.open);
    return;
  }
  const el = e.target.closest('button');
  if (!el) return;
  if (el.dataset.action === 'read') return openReader();
  if (el.dataset.action === 'close') return back();
  if (el.dataset.action === 'share') return share();
  if (el.dataset.view) {
    if (el.dataset.view === 'today' && state.view === 'today') state.dayIdx = 0;
    go(el.dataset.view);
  } else if (el.dataset.cat) {
    state.cat = el.dataset.cat;
    const y = window.scrollY;
    render();
    window.scrollTo(0, y);
  } else if (el.dataset.day) {
    state.dayIdx = +el.dataset.day;
    state.cat = 'all';
    go('today');
  } else if (el.dataset.link) {
    const link = el.dataset.link;
    saved = isSaved(link) ? saved.filter((s) => s.link !== link) : [findItem(link), ...saved].filter(Boolean);
    store.set(saved);
    toast(isSaved(link) ? '저장했어요' : '저장을 취소했어요');
    if (state.view === 'saved') { const y = window.scrollY; render(); window.scrollTo(0, y); }
    document.querySelectorAll('[data-link]').forEach((b) => { if (b.dataset.link === link) b.setAttribute('aria-pressed', isSaved(link)); });
  } else if (el.dataset.action === 'reload') {
    el.classList.add('spin');
    load();
  } else if (el.dataset.action === 'latest') {
    state.dayIdx = 0;
    go('today');
  }
});

function load() {
  return fetch('/news.json')
    .then((r) => r.json())
    .then((data) => { state.days = data.days || []; state.error = false; })
    .catch(() => { state.error = !state.days.length; })
    .finally(() => {
      state.loading = false;
      if (state.dayIdx >= state.days.length) state.dayIdx = 0;
      const y = window.scrollY;
      render();
      window.scrollTo(0, y);
    });
}

// 앱을 백그라운드에 두었다가 다시 열면 최신 뉴스로 갱신
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
render();
load();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
</script>
</body>
</html>
