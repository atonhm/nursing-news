<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>간호·의료 모닝뉴스</title>
<meta name="description" content="매일 아침 7시에 갱신되는 간호·의료 뉴스 모음">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩺</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root {
  --bg: #f6f7f9; --card: #fff; --text: #1a1d23; --muted: #6b7280; --line: #e5e7eb;
  --accent: #0f766e; --accent-soft: #e6f4f1;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #111418; --card: #1a1e24; --text: #e8eaed; --muted: #9aa3ad; --line: #2a3038;
          --accent: #5eead4; --accent-soft: #15302d; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font-family: Pretendard, -apple-system, "Malgun Gothic", sans-serif; line-height: 1.5; }
.wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
header h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: -0.02em; }
header p { margin: 0; color: var(--muted); font-size: 14px; }
.bar { display: flex; gap: 8px; align-items: center; margin: 20px 0 12px; flex-wrap: wrap; }
select { font: inherit; font-size: 14px; padding: 6px 10px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--card); color: var(--text); }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px; scrollbar-width: none; }
.tabs button { flex: none; font: inherit; font-size: 14px; padding: 7px 14px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
section h2 { font-size: 16px; margin: 28px 0 10px; color: var(--accent); }
ol { list-style: none; margin: 0; padding: 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
li + li { border-top: 1px solid var(--line); }
li a { display: block; padding: 13px 16px; color: inherit; text-decoration: none; }
li a:hover { background: var(--accent-soft); }
li a:visited .t { color: var(--muted); }
.t { font-size: 15.5px; font-weight: 500; }
.m { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }
footer { margin-top: 40px; font-size: 12px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🩺 간호·의료 모닝뉴스</h1>
    <p id="sub">불러오는 중…</p>
  </header>
  <div class="bar"><select id="day" aria-label="날짜 선택"></select></div>
  <nav class="tabs" id="tabs"></nav>
  <main id="list"></main>
  <footer>매일 오전 7시(KST) 자동 갱신 · 출처: Google 뉴스</footer>
</div>
<script>
const $ = (id) => document.getElementById(id);
let days = [], tab = 'all';

const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ago = (iso) => {
  const h = Math.floor((Date.now() - new Date(iso)) / 3600e3);
  if (h < 1) return '방금';
  if (h < 24) return `${h}시간 전`;
  return new Date(iso).toLocaleDateString('ko-KR', { month: 'long', day: 'numeric' });
};
const weekday = (d) => new Date(d + 'T00:00:00+09:00').toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' });

function render() {
  const day = days.find((d) => d.date === $('day').value);
  if (!day) return;
  const total = day.categories.reduce((n, c) => n + c.items.length, 0);
  $('sub').textContent = `${weekday(day.date)} · 기사 ${total}건 · ${new Date(day.updatedAt).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })} 갱신`;
  $('tabs').innerHTML = [{ id: 'all', name: '전체' }, ...day.categories]
    .map((c) => `<button data-id="${c.id}" aria-pressed="${c.id === tab}">${c.name}${c.items ? ` ${c.items.length}` : ''}</button>`).join('');
  const cats = day.categories.filter((c) => tab === 'all' || c.id === tab);
  $('list').innerHTML = cats.map((c) => `
    <section>${tab === 'all' ? `<h2>${c.name}</h2>` : ''}
      ${c.items.length ? `<ol>${c.items.map((it) => `
        <li><a href="${esc(it.link)}" target="_blank" rel="noopener">
          <div class="t">${esc(it.title)}</div>
          <div class="m">${esc(it.source)} · ${ago(it.published)}</div>
        </a></li>`).join('')}</ol>` : '<p class="empty">기사가 없습니다.</p>'}
    </section>`).join('');
}

$('tabs').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  tab = b.dataset.id;
  render();
});
$('day').addEventListener('change', render);

fetch('news.json?t=' + Date.now())
  .then((r) => r.json())
  .then((data) => {
    days = data.days;
    $('day').innerHTML = days.map((d, i) => `<option value="${d.date}">${weekday(d.date)}${i === 0 ? ' (최신)' : ''}</option>`).join('');
    render();
  })
  .catch(() => { $('sub').textContent = '뉴스를 불러오지 못했습니다.'; });
</script>
</body>
</html>
